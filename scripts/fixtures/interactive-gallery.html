<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>char图集</title><style>body{background-color:#2b2b2b;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:0;overflow-x:hidden;}.h_x9a1{background-color:#141414;color:#e0e0e0;text-align:center;padding:15px 0;font-size:1.2em;font-weight:bold;border-bottom:1px solid #3a3a3a;}.w_k2p4{width:100%;max-width:100%;margin:0 auto;padding:20px 10px;box-sizing:border-box;background-color:#2b2b2b;}.g_m8n3{position:relative;width:100%;max-width:800px;height:480px;margin:20px auto 40px;display:flex;justify-content:center;align-items:center;overflow:hidden;user-select:none;touch-action:pan-y;}.c_v5b7{position:absolute;width:75%;height:90%;background-color:#1e1e1e;border:1px solid #3a3a3a;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.25,.8,.25,1),opacity .4s ease,background-color .4s;display:flex;flex-direction:column;overflow:hidden;cursor:grab;}.c_v5b7:active{cursor:grabbing;}.c_t1r6{padding:25px;height:100%;overflow-y:auto;scrollbar-width:none;box-sizing:border-box;}.c_t1r6::-webkit-scrollbar{display:none;}.c_t1r6 p{margin:0;line-height:1.7;white-space:pre-wrap;color:#e0e0e0;}.c_v5b7.s_act{transform:translateX(0) scale(1);z-index:10;opacity:1;background-color:#1e1e1e;}.c_v5b7.s_prev{transform:translateX(-12%) scale(.92);z-index:5;opacity:.7;background-color:#181818;cursor:pointer;}.c_v5b7.s_next{transform:translateX(12%) scale(.92);z-index:5;opacity:.7;background-color:#181818;cursor:pointer;}.c_v5b7.s_hide{transform:translateX(0) scale(.8);z-index:1;opacity:0;pointer-events:none;}.b_z3x8,.m_q4w9{max-width:800px;margin:0 auto 20px;background-color:#1e1e1e;border:1px solid #3a3a3a;border-radius:8px;padding:20px;box-sizing:border-box;}.b_z3x8 p{margin:0;line-height:1.6;color:#e0e0e0;}.m_q4w9 h3{margin-top:0;border-bottom:1px solid #3a3a3a;padding-b gging=false;var diff=endX-startX;var threshold=40;if(diff<-threshold){currentIndex=(currentIndex+1)%cards.length;updateCards()}else if(diff>threshold){currentIndex=(currentIndex-1+cards.length)%cards.length;updateCards()}}cards.forEach(function(card,index){card.addEventListener('click',function(){if(card.classList.contains('s_next')){currentIndex=(currentIndex+1)%cards.length;updateCards()}else if(card.classList.contains('s_prev')){currentIndex=(currentIndex-1+cards.length)%cards.length;updateCards()}})});container.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;isDragging=true},{passive:true});container.addEventListener('touchend',function(e){handleEnd(e.changedTouches[0].clientX)},{passive:true});container.addEventListener('mousedown',function(e){startX=e.clientX;isDragging=true});window.addEventListener('mouseup',function(e){if(isDragging)handleEnd(e.clientX)});updateCards()})();</script></body></html>
